<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор плитки">
<title>Онлайн-калькулятор плитки</title>
<style>
  :root{
    --card:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --brand:#2563eb;
    --brand-dark:#1d4ed8;
    --ok:#16a34a;
    --ok-bg:#dcfce7;
    --err:#dc2626;
    --err-bg:#fef2f2;
    --load-bg:#eff6ff;
    --load:#1d4ed8;
    --radius:16px;
    --shadow:0 10px 30px rgba(2,6,23,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0)}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background-color:#0f172a;
    background:-webkit-linear-gradient(300deg,#0f172a 0%,#1e293b 45%,#334155 100%);
    background:linear-gradient(160deg,#0f172a 0%,#1e293b 45%,#334155 100%);
    min-height:100vh;
    min-height:-webkit-fill-available;
    padding:24px 14px 60px;
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  header h1{
    color:#fff;font-size:26px;font-weight:800;letter-spacing:-.5px;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  header .icon{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    display:inline-flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:0 6px 16px rgba(59,130,246,.45);
  }
  header p{color:#94a3b8;font-size:13px;margin-top:6px}

  #status{
    margin:14px 0 0;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:9px;transition:.2s;
  }
  #status .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .st-load{background:var(--load-bg);color:var(--load)}
  .st-load .dot{background:var(--load);animation:pulse 1s infinite}
  .st-ok{background:var(--ok-bg);color:#166534}
  .st-ok .dot{background:var(--ok)}
  .st-err{background:var(--err-bg);color:var(--err)}
  .st-err .dot{background:var(--err)}
  #retryBtn{display:none;margin-top:9px;width:auto;padding:9px 13px;font-size:13px}
  #refreshBtn{margin-top:9px;width:auto;padding:9px 13px;font-size:13px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px 20px;margin-top:16px;
  }
  .field{margin-bottom:18px;position:relative}
  .field:last-child{margin-bottom:0}
  label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:7px}
  label .hint{font-weight:500;color:var(--muted)}
  .field-hint{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.4}
  input[type=text],select{
    width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);
    border-radius:12px;outline:none;transition:.15s;background:#f8fafc;color:var(--ink);
    -webkit-appearance:none;appearance:none;-webkit-border-radius:12px;
  }
  select{background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
  input[type=text]:focus,select:focus{border-color:var(--brand);background-color:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  input:disabled{opacity:.6;cursor:not-allowed}

  .dropdown{
    position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:40;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 14px 34px rgba(2,6,23,.18);max-height:320px;overflow-y:auto;display:none;
    -webkit-overflow-scrolling:touch;
  }
  .dropdown.open{display:block}
  .opt{padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:.1s}
  .opt:last-child{border-bottom:none}
  .opt:hover{background:#eff6ff}
  .opt .t1{font-size:14px;font-weight:600;color:var(--ink)}
  .opt .t2{font-size:12px;color:var(--muted);margin-top:2px}
  .opt .badge{
    display:inline-block;font-size:11px;font-weight:700;color:var(--brand);
    background:#eff6ff;border-radius:6px;padding:1px 7px;margin-right:6px;
  }
  .opt-empty{padding:14px;text-align:center;color:var(--muted);font-size:14px}
  .stock{font-weight:800}
  .stock-ok{color:var(--ok)}
  .stock-low{color:#c2410c}
  .stock-none{color:var(--err)}
  .stock-unknown{color:var(--muted)}

  .row{display:flex;gap:14px}
  .row .field{flex:1}

  .btn{
    width:100%;padding:15px;font-size:16px;font-weight:800;color:#fff;border:none;
    border-radius:12px;cursor:pointer;margin-top:4px;
    -webkit-appearance:none;appearance:none;
    background:var(--brand-dark);
    background:-webkit-linear-gradient(315deg,var(--brand),var(--brand-dark));
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    box-shadow:0 8px 20px rgba(37,99,235,.35);transition:.15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(37,99,235,.45)}
  .btn:active{transform:translateY(0)}
  .btn-2nd{
    flex:1;width:auto;font-size:13px;padding:11px;
    background:#f1f5f9;color:var(--brand-dark);box-shadow:none;
    background-image:none;
  }
  .btn-2nd:hover{transform:none;box-shadow:none;background:#e2e8f0}
  .btn-ghost{
    width:100%;margin-top:16px;padding:13px;font-size:14px;font-weight:800;
    color:var(--brand-dark);background:#eff6ff;border:1.5px dashed #bfdbfe;
    box-shadow:none;background-image:none;
  }
  .btn-ghost:hover{transform:none;box-shadow:none;background:#dbeafe}
  .btn-clear{width:100%;margin-top:10px}
  .reserve-options{display:flex;gap:8px;margin-bottom:9px}
  .reserve-option{width:auto;margin:0;padding:8px 12px;font-size:13px;background:#f1f5f9;color:var(--brand-dark);box-shadow:none;background-image:none}
  .reserve-option:hover{transform:none;box-shadow:none;background:#e2e8f0}
  .reserve-option.active{background:var(--brand);color:#fff}
  .mode-toggle{
    display:flex;background:#f1f5f9;border-radius:12px;padding:4px;margin-bottom:16px;gap:4px;
  }
  .mode-option{
    flex:1;width:auto;margin:0;padding:9px 8px;font-size:12.5px;font-weight:700;
    background:transparent;color:var(--muted);box-shadow:none;background-image:none;border-radius:9px;
  }
  .mode-option:hover{transform:none;box-shadow:none;background:transparent;color:var(--brand-dark)}
  .mode-option.active{background:#fff;color:var(--brand-dark);box-shadow:0 1px 3px rgba(2,6,23,.12)}
  .mode-packs{display:none}
  #copy-msg{
    margin-top:8px;font-size:12.5px;color:var(--ok);font-weight:600;min-height:16px;text-align:center;
  }

  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .res-cell{
    background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;
  }
  .res-cell .k{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .res-cell .v{font-size:20px;font-weight:800;color:var(--ink)}
  .res-cell.total{
    grid-column:1 / -1;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#bfdbfe;
  }
  .res-cell.total .v{color:var(--brand-dark);font-size:26px}
  .details{
    font-size:12.5px;color:var(--muted);background:#f8fafc;border:1px dashed var(--line);
    border-radius:10px;padding:11px 13px;line-height:1.6;
  }
  #warn{
    margin-top:14px;padding:14px 16px;border-radius:12px;font-weight:700;
    color:#7c2d12;background:linear-gradient(135deg,#ffedd5,#fed7aa);
    border:1.5px solid #fdba74;font-size:14px;display:none;align-items:center;gap:10px;
  }
  #warn.show{display:flex}
  #warn .wi{font-size:20px;flex:none}
  #inline-err{
    display:none;margin-top:12px;padding:12px 14px;border-radius:10px;
    background:var(--err-bg);color:var(--err);font-size:14px;font-weight:600;
  }
  #inline-err.show{display:block}

  /* ---------- Позиции сметы ---------- */
  .item-card{position:relative}
  .item-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
  .item-title{display:flex;align-items:center;gap:9px;min-width:0}
  .item-badge{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;
    font-size:12px;font-weight:800;
  }
  .item-title-text{
    font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .item-remove{
    width:30px;height:30px;border-radius:9px;border:none;flex:none;
    background:#fef2f2;color:var(--err);font-size:15px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .item-remove:hover{background:#fee2e2;transform:scale(1.05)}

  .item-result{margin-top:16px;padding:14px 14px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
  .item-result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .item-result-cell .k{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .item-result-cell .v{font-size:14.5px;font-weight:800;color:var(--ink);margin-top:3px}
  .item-result-total{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .item-result-total span:first-child{font-size:12.5px;color:var(--muted);font-weight:600}
  .item-result-total .v{font-size:17px;font-weight:800;color:var(--brand-dark)}
  .item-warn{
    margin-top:10px;padding:9px 11px;border-radius:9px;background:#fff7ed;color:#c2410c;
    font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;
  }

  #itemsList .item-card{margin-top:14px}
  #itemsList .item-card:first-child{margin-top:16px}

  /* ---------- Итоговая смета ---------- */
  #summary{display:none;margin-top:16px}
  .summary-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .summary-icon{
    width:32px;height:32px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
  }
  .summary-title{font-size:16px;font-weight:800;color:var(--ink)}
  .summary-table-wrap{overflow-x:auto;margin-top:16px;border-radius:12px;border:1px solid var(--line)}
  .summary-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}
  .summary-table th{
    text-align:left;color:var(--muted);font-weight:700;padding:10px 12px;
    background:#f8fafc;border-bottom:1px solid var(--line);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;
  }
  .summary-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:var(--ink);white-space:nowrap}
  .summary-table td:first-child{white-space:normal;font-weight:600}
  .summary-table tr:last-child td{border-bottom:none}

  @media(max-width:480px){
    header h1{font-size:22px}
    .card{padding:18px 15px}
    .row{flex-direction:column;gap:0}
    .res-cell .v{font-size:18px}
    .res-cell.total .v{font-size:23px}
    .item-result-grid{grid-template-columns:repeat(2,1fr);row-gap:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="icon">▦</span> Калькулятор плитки</h1>
    <p>Смета из нескольких позиций с расчётом упаковок, площади и стоимости</p>
  </header>

  <div id="status" class="st-load"><span class="dot"></span><span id="status-text">Загрузка данных…</span></div>
  <button class="btn btn-2nd" id="refreshBtn" type="button" disabled>Обновить остатки</button>
  <button class="btn btn-2nd" id="retryBtn" type="button">Повторить загрузку</button>

  <div class="card">
    <div class="field">
      <label for="warehouse">Склад <span class="hint">— для проверки остатков</span></label>
      <select id="warehouse">
        <option value="moscow">Москва</option>
        <option value="tver">Тверь</option>
      </select>
    </div>
  </div>

  <div id="itemsList"></div>

  <button class="btn btn-ghost" id="addItemBtn" type="button">+ Добавить позицию</button>
  <button class="btn btn-2nd btn-clear" id="clearBtn" type="button" onclick="window.clearCalculator()">Очистить всю смету</button>
  <div id="inline-err"></div>

  <div id="summary">
    <div class="card">
      <div class="summary-head">
        <span class="summary-icon">Σ</span>
        <span class="summary-title">Итого по смете</span>
      </div>
      <div id="summary-body"></div>
      <div id="warn"><span class="wi">⚠️</span><span id="warn-text"></span></div>
      <div class="row" style="margin-top:16px">
        <button class="btn btn-2nd" id="copyResultBtn" onclick="window.copyResult()">Скопировать результат</button>
        <button class="btn btn-2nd" id="copyLinkBtn" onclick="window.copyShareLink()">Скопировать ссылку</button>
      </div>
      <div id="copy-msg"></div>
    </div>
  </div>
</div>

<script>
var SHEET_ID = '1dqYgo6PI2ttiQgbF8QhLzOI19VSFSEdthK_xDX5Mk04';
var SHEETS = ['60*60', '60*120', '60x60', '60x120', '60х60', '60х120'];

var TILES = [];
var SEEN = {};
var ACTIVE_WAREHOUSE = 'moscow';
var isFirstLoad = true;

var HARD = {
  '60x60':  { pack: 1.8,  pieces: 5, weight: 34 },
  '60x120': { pack: 1.44, pieces: 2, weight: 27 }
};

function normSize(raw){
  if(raw == null) return '';
  var s = String(raw).toLowerCase();
  s = s.replace(/[хx*×]/g, 'x');
  s = s.replace(/[^0-9x]/g, '');
  s = s.replace(/600x600/, '60x60')
       .replace(/600x1200/, '60x120')
       .replace(/1200x600/, '60x120');
  if(/^60x60$/.test(s)) return '60x60';
  if(/^(60x120|120x60)$/.test(s)) return '60x120';
  return '';
}

function prettySize(key){
  if(key === '60x60') return '60х60';
  if(key === '60x120') return '60х120';
  return '';
}

function toNumber(v){
  if(v == null) return NaN;
  if(typeof v === 'number') return v;
  var s = String(v).trim();
  if(s === '') return NaN;
  s = s.replace(/\s/g, '').replace(/ /g, '').replace(',', '.');
  s = s.replace(/[^0-9.\-]/g, '');
  var n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

function fmt(n, dec){
  if(dec == null) dec = 0;
  var x = Number(n);
  if(!isFinite(x)) x = 0;
  var parts = x.toFixed(dec).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return parts.join('.');
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function findCols(headers){
  var h = headers.map(function(x){ return String(x == null ? '' : x).toLowerCase().trim(); });
  function find(keys){
    for(var i=0;i<h.length;i++){
      for(var k=0;k<keys.length;k++){
        if(h[i].indexOf(keys[k]) !== -1) return i;
      }
    }
    return -1;
  }
  function findAll(keys){
    for(var i=0;i<h.length;i++){
      var matches = true;
      for(var k=0;k<keys.length;k++){
        if(h[i].indexOf(keys[k]) === -1){ matches = false; break; }
      }
      if(matches) return i;
    }
    return -1;
  }
  var idx = {
    article: find(['артикул','артик']),
    name:    find(['назв','наимен']),
    size:    find(['формат','размер','разм']),
    pack:    find(['пакинг','упаковк','кв.м','кв. м','м2','packing']),
    price:   find(['цена','стоимост','прайс']),
    stockMoscow: findAll(['склад','москва']),
    stockTver: findAll(['склад','твер']),
    reserveMoscow: findAll(['резерв','москва']),
    reserveTver: findAll(['резерв','твер'])
  };
  if(idx.stockMoscow === -1) idx.stockMoscow = find(['москва']);
  if(idx.stockMoscow === -1) idx.stockMoscow = find(['склад','остаток','остатки']);
  if(idx.article === -1) idx.article = 0;
  return idx;
}

var pending = 0;
var loadAttempt = 0;

function loadSheet(sheetName, cbName, attempt){
  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
            '/gviz/tq?tqx=out:json;responseHandler:' + cbName +
            '&sheet=' + encodeURIComponent(sheetName);
  var s = document.createElement('script');
  s.src = url;
  s.onerror = function(){ if(attempt === loadAttempt) finishOne(); };
  document.head.appendChild(s);
}

function handleData(json, sheetName){
  try{
    if(!json || !json.table || !json.table.cols){ return; }
    var cols = json.table.cols;
    var rows = json.table.rows || [];

    var headers = cols.map(function(c){ return c && c.label ? c.label : ''; });
    var hasLabels = headers.some(function(x){ return String(x).trim() !== ''; });

    var dataRows = rows;
    if(!hasLabels && rows.length){
      headers = (rows[0].c || []).map(function(cell){
        return cell ? (cell.f != null ? cell.f : cell.v) : '';
      });
      dataRows = rows.slice(1);
    }

    var idx = findCols(headers);
    if(idx.article === -1 && idx.name === -1 && idx.size === -1) return;

    for(var r=0; r<dataRows.length; r++){
      var c = dataRows[r].c || [];
      function cell(i){
        if(i < 0 || !c[i]) return '';
        var o = c[i];
        return (o.f != null ? o.f : (o.v != null ? o.v : ''));
      }
      var article = String(cell(idx.article)).trim();
      var name    = String(cell(idx.name)).trim();
      var sizeRaw = String(cell(idx.size)).trim();
      var priceN  = toNumber(cell(idx.price));
      var stockMoscowN = toNumber(cell(idx.stockMoscow));
      var stockTverN = toNumber(cell(idx.stockTver));
      var reserveMoscowN = toNumber(cell(idx.reserveMoscow));
      var reserveTverN = toNumber(cell(idx.reserveTver));
      var packN   = toNumber(cell(idx.pack));

      if(!article && !name && !sizeRaw) continue;

      var packRaw = String(cell(idx.pack)).trim();
      var sizeKey = normSize(sizeRaw) || normSize(name) || normSize(packRaw) || normSize(sheetName);
      if(!sizeKey) continue;

      var pack = packN, pieces = null, weight = null;
      if(sizeKey && HARD[sizeKey]){
        pack   = HARD[sizeKey].pack;
        pieces = HARD[sizeKey].pieces;
        weight = HARD[sizeKey].weight;
      }
      if(!isFinite(pack) || pack <= 0) continue;

      var dedupKey = (article || name).toLowerCase() + '|' + (sizeKey || sizeRaw.toLowerCase());
      if(SEEN[dedupKey]) continue;
      SEEN[dedupKey] = true;

      TILES.push({
        article: article,
        name: name || article,
        sizeKey: sizeKey,
        sizeLabel: sizeKey ? prettySize(sizeKey) : sizeRaw,
        pack: pack,
        pieces: pieces,
        weight: weight,
        price: isFinite(priceN) ? priceN : null,
        stockMoscow: isFinite(stockMoscowN) ? stockMoscowN : null,
        stockTver: isFinite(stockTverN) ? stockTverN : null,
        reserveMoscow: isFinite(reserveMoscowN) ? reserveMoscowN : 0,
        reserveTver: isFinite(reserveTverN) ? reserveTverN : 0
      });
    }
  }catch(e){ }
}

function finishOne(){
  if(pending <= 0) return;
  pending--;
  if(pending <= 0) allDone();
}

function allDone(){
  var st = document.getElementById('status');
  var stt = document.getElementById('status-text');
  var retry = document.getElementById('retryBtn');
  var refresh = document.getElementById('refreshBtn');
  var searches = document.querySelectorAll('.item-search');
  if(TILES.length > 0){
    st.className = 'st-ok';
    stt.textContent = 'Успешно загружено ' + TILES.length + ' позиций';
    retry.style.display = 'none';
    refresh.disabled = false;
    for(var i=0;i<searches.length;i++){
      searches[i].disabled = false;
      searches[i].placeholder = 'Начните вводить…';
    }
    if(isFirstLoad){
      isFirstLoad = false;
      restoreState();
    }else{
      reSyncTiles();
    }
  }else{
    st.className = 'st-err';
    stt.textContent = 'Ошибка: не удалось загрузить данные из таблицы';
    retry.style.display = 'inline-block';
    refresh.disabled = false;
  }
}

function startLoading(){
  var attempt = ++loadAttempt;
  TILES = [];
  SEEN = {};
  pending = SHEETS.length;
  document.getElementById('status').className = 'st-load';
  document.getElementById('status-text').textContent = 'Загрузка данных…';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('refreshBtn').disabled = true;
  SHEETS.forEach(function(sheetName, i){
    var cbName = 'gviz_cb_' + i;
    window[cbName] = (function(sn){
      return function(json){
        if(attempt !== loadAttempt) return;
        handleData(json, sn);
        finishOne();
      };
    })(sheetName);
    loadSheet(sheetName, cbName, attempt);
  });
  setTimeout(function(){
    if(attempt === loadAttempt && pending > 0){ pending = 0; allDone(); }
  }, 12000);
}

document.getElementById('retryBtn').addEventListener('click', startLoading);
document.getElementById('refreshBtn').addEventListener('click', startLoading);

var warehouseEl = document.getElementById('warehouse');
warehouseEl.addEventListener('change', function(){
  ACTIVE_WAREHOUSE = warehouseEl.value === 'tver' ? 'tver' : 'moscow';
  var opens = document.querySelectorAll('.dropdown.open');
  for(var i=0;i<opens.length;i++){ opens[i].classList.remove('open'); }
  recalcAll();
});

function warehouseName(){
  return ACTIVE_WAREHOUSE === 'tver' ? 'Тверь' : 'Москва';
}

function warehouseStock(t){
  var stock = ACTIVE_WAREHOUSE === 'tver' ? t.stockTver : t.stockMoscow;
  var reserved = ACTIVE_WAREHOUSE === 'tver' ? t.reserveTver : t.reserveMoscow;
  if(!isFinite(reserved) || reserved < 0) reserved = 0;
  return {
    stock: stock,
    reserved: reserved,
    available: stock != null && isFinite(stock) ? Math.max(stock - reserved, 0) : null
  };
}

function stockStatus(t){
  var warehouse = warehouseStock(t);
  if(warehouse.available == null) return { text: 'Наличие уточняйте', className: 'stock-unknown' };
  var packs = Math.floor(warehouse.available / t.pack);
  if(packs <= 0) return { text: 'Нет в наличии', className: 'stock-none' };
  if(packs <= 5) return { text: 'Мало', className: 'stock-low' };
  return { text: 'В наличии', className: 'stock-ok' };
}

function findTileByKey(article, sizeKey){
  for(var i=0;i<TILES.length;i++){
    if(TILES[i].article === article && TILES[i].sizeKey === sizeKey) return TILES[i];
  }
  return null;
}

function addItem(){
  itemSeq++;
  var item = { id: itemSeq, tile: null, area: '', price: '', reserve: '', mode: 'area', packsCount: '' };
  items.push(item);
  var row = createItemRow(item);
  itemsListEl.appendChild(row);
  renumberItems();
  return item;
}

function removeItem(id){
  var idx = -1;
  for(var i=0;i<items.length;i++){ if(items[i].id === id){ idx = i; break; } }
  if(idx === -1) return;
  var item = items[idx];
  item._el.parentNode.removeChild(item._el);
  items.splice(idx, 1);
  if(items.length === 0){ addItem(); }
  renumberItems();
  recalcAll();
}

function renumberItems(){
  for(var i=0;i<items.length;i++){
    items[i]._badgeEl.textContent = String(i + 1);
  }
}

document.getElementById('addItemBtn').addEventListener('click', function(){
  addItem();
});

function computeItemResult(item){
  if(!item.tile) return null;
  var t = item.tile;
  var pack = t.pack;
  var price = toNumber(item.price);
  if(!isFinite(price) || price < 0){ price = (t.price != null ? t.price : NaN); }

  var area, reserve, areaWithReserve, packs;
  if(item.mode === 'packs'){
    var packsWanted = toNumber(item.packsCount);
    if(!isFinite(packsWanted) || packsWanted <= 0) return null;
    reserve = 0;
    packs = Math.ceil(packsWanted - 1e-9);
    areaWithReserve = packs * pack;
    area = packs * pack;
  }else{
    area = toNumber(item.area);
    if(!isFinite(area) || area <= 0) return null;
    reserve = toNumber(item.reserve);
    if(!isFinite(reserve) || reserve < 0) reserve = 0;
    areaWithReserve = area * (1 + reserve / 100);
    packs = Math.ceil(areaWithReserve / pack - 1e-9);
  }
  var buyArea = packs * pack;
  var total = isFinite(price) ? buyArea * price : NaN;
  var pieces = t.pieces != null ? packs * t.pieces : null;
  var weight = t.weight != null ? packs * t.weight : null;
  var warehouse = warehouseStock(t);
  var packsAvail = warehouse.available != null ? Math.floor(warehouse.available / pack) : null;
  var shortage = (packsAvail != null && packsAvail < packs)
    ? { shortPacks: packs - packsAvail, shortArea: (packs - packsAvail) * pack }
    : null;
  return {
    area: area, price: price, reserve: reserve, areaWithReserve: areaWithReserve,
    packs: packs, buyArea: buyArea, total: total, pieces: pieces, weight: weight,
    shortage: shortage
  };
}

function renderItemResult(item, res){
  var el = item._resultEl;
  if(!res){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';
  var t = item.tile;
  var warehouse = warehouseStock(t);
  el.innerHTML =
    '<div class="item-result-grid">' +
      '<div class="item-result-cell"><div class="k">Упаковок</div><div class="v">' + fmt(res.packs) + ' уп.</div></div>' +
      '<div class="item-result-cell"><div class="k">К покупке</div><div class="v">' + fmt(res.buyArea, 2) + ' м²</div></div>' +
      '<div class="item-result-cell"><div class="k">Штук</div><div class="v">' + (res.pieces != null ? fmt(res.pieces) + ' шт.' : '—') + '</div></div>' +
      '<div class="item-result-cell"><div class="k">Вес</div><div class="v">' + (res.weight != null ? fmt(res.weight, 0) + ' кг' : '—') + '</div></div>' +
    '</div>' +
    '<div class="item-result-total"><span>Стоимость позиции</span><span class="v">' + (isFinite(res.total) ? fmt(res.total, 0) + ' руб' : 'укажите цену') + '</span></div>' +
    (res.reserve > 0 ? '<div class="field-hint">Запас ' + fmt(res.reserve) + '%: ' + fmt(res.areaWithReserve, 2) + ' м²</div>' : '') +
    (warehouse.stock != null ? '<div class="field-hint">Склад ' + warehouseName() + ': доступно ' + fmt(warehouse.available, warehouse.available%1?2:0) + ' м²</div>' : '') +
    (res.shortage ? '<div class="item-warn">⚠️ Не хватает ' + fmt(res.shortage.shortPacks) + ' упак (' + fmt(res.shortage.shortArea, 2) + ' м²)</div>' : '');
}

function renderSummary(anyValid, totals){

    summaryEl.style.display = 'none';
    return;
  }
  summaryEl.style.display = 'block';

  }

      '<div class="res-cell"><div class="k">Позиций</div><div class="v">' + totals.rows.length + '</div></div>' +
      '<div class="res-cell"><div class="k">Упаковок всего</div><div class="v">' + fmt(totals.totalPacks) + '</div></div>' +
      '<div class="res-cell"><div class="k">Площадь к покупке</div><div class="v">' + fmt(totals.totalBuyArea, 2) + ' м²</div></div>' +
      '<div class="res-cell"><div class="k">Вес всего</div><div class="v">' + (totals.totalWeight ? fmt(totals.totalWeight, 0) + ' кг' : '—') + '</div></div>' +

    '<div class="summary-table-wrap"><table class="summary-table"><thead><tr><th>Позиция</th><th>Упак.</th><th>Площадь</th><th>Стоимость</th></tr></thead><tbody>' +
    rowsHtml + '</tbody></table></div>';

  renderSummaryWarning(totals);

function renderSummaryWarning(totals){
  var warn = document.getElementById('warn');
  var warnText = document.getElementById('warn-text');
  if(totals.shortages.length === 0){
    warn.classList.remove('show');
    return;
  }
  var parts = [];
  for(var i=0;i<totals.shortages.length;i++){
    parts.push(totals.shortages[i].name + ' — не хватает ' + fmt(totals.shortages[i].shortPacks) + ' упак');
  }
  warnText.textContent = 'Внимание! На складе ' + warehouseName() + ' не хватает: ' + parts.join('; ');
  warn.classList.add('show');
}

function recalcAll(){
  var anyValid = false;
  var totalBuyArea = 0, totalWeight = 0, totalCost = 0, costUnknown = false, totalPacks = 0;
  var rows = [];
  var shortages = [];

  for(var i=0;i<items.length;i++){
    var item = items[i];
    var res = computeItemResult(item);
    renderItemResult(item, res);
    if(res){
      anyValid = true;
      totalBuyArea += res.buyArea;
      totalPacks += res.packs;
      if(res.weight != null) totalWeight += res.weight;
      if(isFinite(res.total)) totalCost += res.total; else costUnknown = true;
      var name = item.tile.name + (item.tile.sizeLabel ? ' (' + item.tile.sizeLabel + ')' : '');
      rows.push({ name: name, packs: res.packs, buyArea: res.buyArea, total: res.total });
      if(res.shortage){ shortages.push({ name: name, shortPacks: res.shortage.shortPacks }); }
    }
  }

  renderSummary(anyValid, {
    totalBuyArea: totalBuyArea, totalWeight: totalWeight, totalCost: totalCost,
    costUnknown: costUnknown, totalPacks: totalPacks, rows: rows, shortages: shortages
  });

  if(anyValid){ saveState(); }
}

function reSyncTiles(){
  for(var i=0;i<items.length;i++){
    var item = items[i];
    if(item.tile){
      var fresh = findTileByKey(item.tile.article, item.tile.sizeKey);
      if(fresh) item.tile = fresh;
    }
  }
  recalcAll();
}

function hideInlineErr(){
  var el = document.getElementById('inline-err');
  if(el){ el.classList.remove('show'); }
}

/* ---------- Восстановление состояния: из ссылки или из localStorage ---------- */
var STORAGE_KEY = 'tileCalcState';
var lastState = null;

function saveState(){
  var validItems = [];
  for(var i=0;i<items.length;i++){
    var it = items[i];
    var hasValue = it.mode === 'packs' ? toNumber(it.packsCount) > 0 : toNumber(it.area) > 0;
    if(it.tile && hasValue){
      validItems.push({
        article: it.tile.article, size: it.tile.sizeKey, mode: it.mode,
        area: String(it.area), packsCount: String(it.packsCount || ''),
        price: String(it.price || ''), reserve: String(it.reserve || '')
      });
    }
  }
  if(!validItems.length) return;
  var state = { warehouse: ACTIVE_WAREHOUSE, items: validItems };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  lastState = state;
}

function restoreState(){
  var params = new URLSearchParams(window.location.search);
  var state = null;
  if(params.has('items')){
    try{
      state = { warehouse: params.get('warehouse') || 'moscow', items: JSON.parse(params.get('items')) };
    }catch(e){}
  }else{
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) state = JSON.parse(raw);
    }catch(e){}
  }
  if(!state || !state.items || !state.items.length){
    if(items.length === 0) addItem();
    return;
  }

  ACTIVE_WAREHOUSE = state.warehouse === 'tver' ? 'tver' : 'moscow';
  warehouseEl.value = ACTIVE_WAREHOUSE;

  while(items.length){
    var it = items[items.length - 1];
    it._el.parentNode.removeChild(it._el);
    items.pop();
  }

  for(var i=0;i<state.items.length;i++){
    var s = state.items[i];
    var t = findTileByKey(s.article, s.size);
    var item = addItem();
    if(t){ item._selectRowTile(t); }
    if(s.mode === 'packs'){
      item._setMode('packs');
      item._packsEl.value = s.packsCount || ''; item.packsCount = item._packsEl.value;
    }else{
      item._areaEl.value = s.area || ''; item.area = item._areaEl.value;
      if(s.reserve){ item._setReserveUI(s.reserve); item.reserve = s.reserve; }
    }
    if(s.price){ item._priceEl.value = s.price; item.price = s.price; }
  }

  if(items.length === 0) addItem();
  recalcAll();
}

window.clearCalculator = function(){
  ACTIVE_WAREHOUSE = 'moscow';
  warehouseEl.value = ACTIVE_WAREHOUSE;
  while(items.length){
    var it = items[items.length - 1];
    it._el.parentNode.removeChild(it._el);
    items.pop();
  }
  addItem();
  lastState = null;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('warn').classList.remove('show');
  document.getElementById('copy-msg').textContent = '';
  hideInlineErr();
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  if(window.history && window.history.replaceState){
    window.history.replaceState(null, '', window.location.pathname);
  }
};

window.copyResult = function(){
  if(!lastState) return;
  var lines = ['Смета плитки', 'Склад: ' + warehouseName(), ''];
  var totalArea = 0, totalCost = 0, costUnknown = false;
  for(var i=0;i<items.length;i++){
    var res = computeItemResult(items[i]);
    if(!res) continue;
    var t = items[i].tile;
    lines.push((i + 1) + '. ' + t.name + (t.sizeLabel ? ' (' + t.sizeLabel + ')' : '') +
      ' — ' + fmt(res.packs) + ' уп. (' + fmt(res.buyArea, 2) + ' м²) — ' +
      (isFinite(res.total) ? fmt(res.total, 0) + ' руб' : 'цена не указана'));
    totalArea += res.buyArea;
    if(isFinite(res.total)) totalCost += res.total; else costUnknown = true;
  }
  lines.push('');
  lines.push('Площадь к покупке всего: ' + fmt(totalArea, 2) + ' м²');
  lines.push('Итого: ' + fmt(totalCost, 0) + ' руб' + (costUnknown ? ' (не все позиции с ценой)' : ''));
  copyToClipboard(lines.join('\n'));
};

window.copyShareLink = function(){
  if(!lastState) return;
  var params = new URLSearchParams();
  params.set('warehouse', lastState.warehouse);
  params.set('items', JSON.stringify(lastState.items));
  var url = window.location.origin + window.location.pathname + '?' + params.toString();
  copyToClipboard(url);
};

function copyToClipboard(text){
  var msg = document.getElementById('copy-msg');
  function ok(){ msg.textContent = 'Скопировано ✓'; }
  function execFallback(){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      var success = document.execCommand('copy');
      document.body.removeChild(ta);
      if(success){ ok(); }else{ promptFallback(); }
    }catch(e){ promptFallback(); }
  }
  function promptFallback(){
    window.prompt('Скопируйте вручную (Ctrl/Cmd+C):', text);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, execFallback);
  }else{
    execFallback();
  }
}

addItem();
startLoading();
